name: iPhone build and IPA
on:
  push:
    paths:
      - 'apps/iphone/**'
      - '.github/workflows/iphone.yml'
  pull_request:
    paths:
      - 'apps/iphone/**'
      - '.github/workflows/iphone.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Install pinned XcodeGen
        run: |
          git clone --depth 1 --branch 2.44.1 https://github.com/yonaskolb/XcodeGen.git /tmp/XcodeGen
          cd /tmp/XcodeGen
          swift build -c release
          cp .build/release/xcodegen /usr/local/bin/xcodegen
      - name: Generate Xcode project
        run: cd apps/iphone && xcodegen generate
      - name: Simulator build and tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          UDID=$(xcrun simctl list devices available -j | python3 apps/iphone/select_simulator.py)
          xcodebuild -project apps/iphone/PracovniDenik.xcodeproj -scheme PracovniDenik -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult test CODE_SIGNING_ALLOWED=NO | tee build/simulator.log
      - name: Unsigned iPhone build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project apps/iphone/PracovniDenik.xcodeproj -scheme PracovniDenik -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device build CODE_SIGNING_ALLOWED=NO | tee build/device.log
          python3 apps/iphone/verify_bundle.py build/device/Build/Products/Release-iphoneos/PracovniDenik.app
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/PracovniDenik.app build/package/Payload/
          cd build/package
          zip -qr ../PracovniDenik-UNSIGNED-REQUIRES-SIGNING.ipa Payload
          cd ../..
          shasum -a 256 build/PracovniDenik-UNSIGNED-REQUIRES-SIGNING.ipa > build/IPA-SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PracovniDenik-builds-and-logs-UNSIGNED
          retention-days: 14
          path: |
            build/*.ipa
            build/*.log
            build/IPA-SHA256.txt
            build/Tests.xcresult
