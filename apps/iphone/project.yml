name: PracovniDenik
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
targets:
  PracovniDenik:
    type: application
    platform: iOS
    sources: [App, Core]
    resources: [Resources]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cz.pracovnidenik.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Pracovní deník
        CFBundleDevelopmentRegion: cs
        CFBundleLocalizations: [cs]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Kamera slouží k fotodokumentaci zakázky a zahrady a k pořízení účtenky.
        NSPhotoLibraryUsageDescription: Vyberte fotografie, které chcete připojit k pracovnímu záznamu.
        NSLocationWhenInUseUsageDescription: Poloha se používá při evidenci docházky, navigaci a označení místa práce.
        WKAppBoundDomains:
          - zavlahovy-denik.purplecedar.chatgpt.site
          - dr-garden.purplecedar.chatgpt.site
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  PracovniDenikTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PracovniDenik
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: cz.pracovnidenik.tests
  PracovniDenikUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PracovniDenik
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: cz.pracovnidenik.uitests
schemes:
  PracovniDenik:
    build:
      targets:
        PracovniDenik: all
        PracovniDenikTests: [test]
        PracovniDenikUITests: [test]
    test:
      targets: [PracovniDenikTests, PracovniDenikUITests]
