name: PracovniDenik
options:
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CURRENT_PROJECT_VERSION: 20
    MARKETING_VERSION: 0.8.11
    CODE_SIGN_STYLE: Automatic
    APNS_ENVIRONMENT: development
  configs:
    Debug:
      APNS_ENVIRONMENT: development
    Release:
      APNS_ENVIRONMENT: production
targets:
  PracovniDenik:
    type: application
    platform: iOS
    sources:
      - path: App
        includes: [PracovniDenikApp.swift, DiaryDesign.swift, NativePushSettings.swift, WatchPhoneSettings.swift]
      - path: Core
        includes: [NativeModels.swift, DiaryDate.swift, EndpointPolicy.swift, NativePushController.swift, WatchPhoneCoordinator.swift]
      - path: NativeAPI
      - path: Resources
        excludes: ['*.js']
      - path: WatchShared
    dependencies:
      - target: PracovniDenikWatch
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cz.pracovnidenik.app
      PROVISIONING_PROFILE_SPECIFIER: $(APPLE_PROFILE_UUID)
      CODE_SIGN_ENTITLEMENTS: Resources/PracovniDenik.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos*]": "$(inherited) MINISTRAL_DEVICE"
      "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/ThirdParty/llama.xcframework/ios-arm64"
      "OTHER_LDFLAGS[sdk=iphoneos*]": "$(inherited) -framework llama"
    preBuildScripts:
      - name: Download llama.cpp device runtime
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          if [[ "${PLATFORM_NAME:-}" != "iphoneos" ]]; then
            exit 0
          fi
          DEST="${SRCROOT}/ThirdParty/llama.xcframework"
          if [[ -d "$DEST/ios-arm64/llama.framework" ]]; then
            exit 0
          fi
          mkdir -p "${SRCROOT}/ThirdParty"
          curl -L --fail --retry 3 -o "${SRCROOT}/ThirdParty/llama.zip" "https://github.com/ggml-org/llama.cpp/releases/download/b10549/llama-b10549-xcframework.zip"
          rm -rf "${SRCROOT}/ThirdParty/unpack"
          unzip -q "${SRCROOT}/ThirdParty/llama.zip" -d "${SRCROOT}/ThirdParty/unpack"
          rm -rf "$DEST"
          mv "${SRCROOT}/ThirdParty/unpack/build-apple/llama.xcframework" "$DEST"
          rm -rf "${SRCROOT}/ThirdParty/llama.zip" "${SRCROOT}/ThirdParty/unpack"
    postBuildScripts:
      - name: Embed llama.cpp device runtime
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          if [[ "${PLATFORM_NAME:-}" != "iphoneos" ]]; then
            exit 0
          fi
          SRC="${SRCROOT}/ThirdParty/llama.xcframework/ios-arm64/llama.framework"
          DEST="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          mkdir -p "$DEST"
          rm -rf "$DEST/llama.framework"
          cp -R "$SRC" "$DEST/llama.framework"
          if [[ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" && -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" && "${EXPANDED_CODE_SIGN_IDENTITY}" != "-" ]]; then
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --timestamp=none "$DEST/llama.framework"
          fi
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Pracovní deník
        CFBundleURLTypes:
          - CFBundleURLName: cz.pracovnidenik.google-drive
            CFBundleURLSchemes: [pracovnidenik]
        NativePushEnvironment: $(APNS_ENVIRONMENT)
        CFBundleDevelopmentRegion: cs
        CFBundleLocalizations: [cs]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Kamera slouží k fotodokumentaci zakázky a zahrady a k pořízení účtenky.
        NSPhotoLibraryUsageDescription: Vyberte fotografie, které chcete připojit k pracovnímu záznamu.
        NSLocationWhenInUseUsageDescription: Poloha se používá při evidenci docházky, navigaci a označení místa práce.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  PracovniDenikWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources: [WatchApp, WatchShared, WatchResources]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cz.pracovnidenik.app.watchapp
      TARGETED_DEVICE_FAMILY: '4'
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SKIP_INSTALL: YES
      PROVISIONING_PROFILE_SPECIFIER: $(WATCH_PROFILE_UUID)
    info:
      path: WatchInfo.plist
      properties:
        CFBundleDisplayName: Pracovní deník
        CFBundleDevelopmentRegion: cs
        CFBundleLocalizations: [cs]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: cz.pracovnidenik.app
        WKRunsIndependentlyOfCompanionApp: false
  PracovniDenikTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [BrowserLifecycleTests.swift, NativeEditQueueTests.swift, NativePresentationTests.swift]
    dependencies:
      - target: PracovniDenik
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: cz.pracovnidenik.tests
  PracovniDenikUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        includes: [NativeAPIUITests.swift, APIJobDetailPreviewUITests.swift, APIDashboardUITests.swift, APIJobsUITests.swift, APIAttendanceUITests.swift, APIProtocolUITests.swift]
    dependencies:
      - target: PracovniDenik
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: cz.pracovnidenik.uitests
schemes:
  PracovniDenik:
    build:
      targets:
        PracovniDenik: all
        PracovniDenikTests: [test]
        PracovniDenikUITests: [test]
    test:
      targets: [PracovniDenikTests, PracovniDenikUITests]
  PracovniDenikWatch:
    build:
      targets:
        PracovniDenikWatch: all
