name: PracovniDenik
options:
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CURRENT_PROJECT_VERSION: 7
    MARKETING_VERSION: 0.6.1
    CODE_SIGN_STYLE: Automatic
    APNS_ENVIRONMENT: development
  configs:
    Debug:
      APNS_ENVIRONMENT: development
    Release:
      APNS_ENVIRONMENT: production
targets:
  PracovniDenik:
    type: application
    platform: iOS
    sources: [App, Core, Resources, WatchShared]
    dependencies:
      - target: PracovniDenikWatch
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cz.pracovnidenik.app
      PROVISIONING_PROFILE_SPECIFIER: $(APPLE_PROFILE_UUID)
      CODE_SIGN_ENTITLEMENTS: Resources/PracovniDenik.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Pracovní deník
        NativePushEnvironment: $(APNS_ENVIRONMENT)
        CFBundleDevelopmentRegion: cs
        CFBundleLocalizations: [cs]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Kamera slouží k fotodokumentaci zakázky a zahrady a k pořízení účtenky.
        NSPhotoLibraryUsageDescription: Vyberte fotografie, které chcete připojit k pracovnímu záznamu.
        NSLocationWhenInUseUsageDescription: Poloha se používá při evidenci docházky, navigaci a označení místa práce.
        WKAppBoundDomains:
          - zavlahovy-denik.purplecedar.chatgpt.site
          - dr-garden.purplecedar.chatgpt.site
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  PracovniDenikWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources: [WatchApp, WatchShared, WatchResources]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cz.pracovnidenik.app.watchapp
      TARGETED_DEVICE_FAMILY: '4'
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SKIP_INSTALL: YES
      PROVISIONING_PROFILE_SPECIFIER: $(WATCH_PROFILE_UUID)
    info:
      path: WatchInfo.plist
      properties:
        CFBundleDisplayName: Pracovní deník
        CFBundleDevelopmentRegion: cs
        CFBundleLocalizations: [cs]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: cz.pracovnidenik.app
        WKRunsIndependentlyOfCompanionApp: false
  PracovniDenikTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PracovniDenik
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: cz.pracovnidenik.tests
  PracovniDenikUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PracovniDenik
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: cz.pracovnidenik.uitests
schemes:
  PracovniDenik:
    build:
      targets:
        PracovniDenik: all
        PracovniDenikTests: [test]
        PracovniDenikUITests: [test]
    test:
      targets: [PracovniDenikTests, PracovniDenikUITests]
  PracovniDenikWatch:
    build:
      targets:
        PracovniDenikWatch: all
